<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tundra Onyx — Chord Weaver</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1>♫ tundra onyx — chord weaver</h1><nav class="lang"><button data-lang="en" class="on">EN</button><button data-lang="de">DE</button></nav></header>
<main><aside class="panel">
<section><h2 data-i="scale">Scale</h2><div class="btncol" id="scales"></div></section>
<section><h2 data-i="chord">Chord</h2><div class="btncol" id="degrees"></div></section>
<section><h2 data-i="play">Playback</h2>
<label><span data-i="octave">Octave</span><input type="range" id="oct" min="2" max="6" value="4"></label>
<label><span data-i="dur">Duration</span><input type="range" id="dur" min="0.2" max="2" step="0.1" value="0.8"></label></section>
<section class="stats"><span data-i="notes">Chord</span> <b id="chordname">—</b></section>
</aside><div class="stage"><canvas id="cv"></canvas></div></main>
<script src="app.js"></script></body></html>
